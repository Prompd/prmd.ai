# Cloud Build pipeline for the prmd.ai API service.
# Deploys to the prompd-io GCP project, shared with prompd.app / prompd.io.
#
# Builds apps/api/Dockerfile from the repo root context, pushes to the
# shared `docker-repo` Artifact Registry, then deploys to Cloud Run.
# Secrets come from Secret Manager at deploy time — never baked.
#
# Required Secret Manager secrets (set up via setup-secrets.bat):
#   prmd-ai-clerk-secret    — sk_live_* from Clerk
#   prmd-ai-google-api-key  — Gemini key from aistudio.google.com
#   prmd-ai-github-token    — PAT with public_repo scope
#   prmd-ai-mongodb-uri     — Mongo connection string for the prmd-ai DB
#   prmd-ai-pushover-token  — Pushover application token (optional)
#   prmd-ai-pushover-user   — Pushover user/group key (optional)
#
# Submit: gcloud builds submit --config deployment/api.cloudbuild.yaml

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/api/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/api-prmd-ai:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/api-prmd-ai:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/api-prmd-ai:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/api-prmd-ai:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'api-prmd-ai'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/api-prmd-ai:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '40'
      - '--port'
      - '8080'
      - '--timeout'
      - '120'
      - '--cpu-throttling'
      - '--set-env-vars'
      - 'NODE_ENV=production,LLM_MODEL=gemini-2.5-flash'
      # Path C launch (anon-only): only the three secrets the URL+manual flows
      # actually need. When upgrading to Clerk Pro + path A, add the commented
      # secrets back and re-deploy (they must exist in Secret Manager first):
      #   ,CLERK_SECRET_KEY=prmd-ai-clerk-secret:latest
      #   ,PUSHOVER_TOKEN=prmd-ai-pushover-token:latest
      #   ,PUSHOVER_USER=prmd-ai-pushover-user:latest
      - '--set-secrets'
      - 'GOOGLE_API_KEY=prmd-ai-google-api-key:latest,GITHUB_TOKEN=prmd-ai-github-token:latest,MONGODB_URI=prmd-ai-mongodb-uri:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/api-prmd-ai:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/api-prmd-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '900s'
