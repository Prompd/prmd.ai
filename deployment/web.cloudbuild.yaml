# Cloud Build pipeline for the prmd.ai web (Vite SPA) service.
# Deploys to the prompd-io GCP project, shared with prompd.app / prompd.io.
#
# Builds apps/web/Dockerfile from the repo root context, then deploys to
# Cloud Run as an nginx container that proxies /api/* to the API service.
#
# Required substitutions:
#   _CLERK_PUBLISHABLE_KEY — pk_live_* from Clerk (safe to bake into bundle)
#   _API_URL               — Cloud Run URL of api-prmd-ai, e.g.
#                            https://api-prmd-ai-xxxxx-uc.a.run.app
#                            Discover with:
#                              gcloud run services describe api-prmd-ai \
#                                --region us-central1 --format='value(status.url)'
#
# Submit:
#   gcloud builds submit --config deployment/web.cloudbuild.yaml \
#     --substitutions=_CLERK_PUBLISHABLE_KEY=pk_live_...,_API_URL=https://...

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/prmd-ai:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/prmd-ai:latest'
      - '--build-arg'
      - 'VITE_CLERK_PUBLISHABLE_KEY=${_CLERK_PUBLISHABLE_KEY}'
      - '--build-arg'
      - 'API_URL=${_API_URL}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/prmd-ai:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/prmd-ai:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'prmd-ai'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/prmd-ai:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '80'
      - '--port'
      - '8080'
      - '--timeout'
      - '60'
      - '--cpu-throttling'
      - '--set-env-vars'
      - 'API_URL=${_API_URL}'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/prmd-ai:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/docker-repo/prmd-ai:latest'

substitutions:
  _CLERK_PUBLISHABLE_KEY: ''
  _API_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '600s'
